operation_id: markdown_forge_document
description: Combine user input with recalled memory context (and optionally an existing document), synthesize or revise a markdown document via an LLM, validate its structure with the markdown-it-py outline tool, and persist it to lisa-storage. For multi-source consolidation (preserve-detail, density floor, OKF provenance), use markdown_consolidate_sources instead.
effect: write
module_path: lisa_packs.markdown.operations.forge_document.forge_document
tool_ids: [markdown_generate, write_file, read_file, memory.search]
# A full-document revision through a cloud reasoning model runs one large
# completion inside the op (the 2026-10-22 char-cap incident: ~207 s for a
# 46.6k-char revision). 300 s left almost no margin; continuation passes and
# the burnout rescue add more calls after the first pass. 600 s matches the
# consolidate op's budget.
timeout_seconds: 600
preferred_model_id: default
exportable: true