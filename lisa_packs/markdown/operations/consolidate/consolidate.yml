operation_id: markdown_consolidate_sources
description: Consolidate multiple source documents into one coherent markdown document, preserving per-source detail (anti-abridgment). Reads every source via lisa-storage, injects them with per-source NL priority notes into a preserve-detail prompt, applies map-reduce when the aggregate is large, enforces a density floor against lossy summarization, and captures OKF provenance.
# Source ingestion uses list_files (glob expansion) + read_file; the
# map-reduce path uses read_file_range (chunking an oversize single source)
# and append_file (opt-in incremental persistence). okf_emit_concept /
# okf_log capture provenance. All are declared here so the kernel allows
# the op to route them through ctx.execute_tool_fn.
tool_ids: [markdown_generate, write_file, read_file, read_file_range, append_file, list_files, memory.search, okf_emit_concept, okf_log]
# A multi-source consolidation issues N per-source forge calls + 1 merge.
# At ~60s per call on a local Ollama backend, 600s covers 8 calls with
# headroom. (Per-call sub-deadlines would be a kernel change — deferred.)
timeout_seconds: 600
preferred_model_id: default
exportable: true